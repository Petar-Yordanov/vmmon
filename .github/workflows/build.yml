name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vmmon:
    name: vmmon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            clang lld \
            ca-certificates \
            qemu-system-x86 qemu-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build vmmon (release)
        run: |
          cargo build -p vmmon --release

      - name: Run vmmon
        shell: bash
        run: |
          set -euxo pipefail

          sudo ./target/release/vmmon ./kernel.elf
