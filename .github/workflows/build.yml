name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vmmon:
    name: vmmon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            clang lld \
            ca-certificates \
            curl jq unzip \
            qemu-system-x86 qemu-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download latest micros main artifact
        env:
          GH_TOKEN: ${{ secrets.MICROS_ARTIFACTS_TOKEN }}
          OWNER: Petar-Yordanov
          REPO: micros
          ARTIFACT_NAME: micros64-ext2
        run: |
          set -euo pipefail

          API="https://api.github.com"
          AUTH_HEADER=(-H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          echo "Finding latest successful run on main..."

          RUN_ID=$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${AUTH_HEADER[@]}" \
              "${API}/repos/${OWNER}/${REPO}/actions/runs?branch=main&status=success&per_page=20" \
            | jq -r '
                .workflow_runs
                | sort_by(.created_at)
                | reverse
                | .[0].id
              '
          )

          test -n "${RUN_ID}"
          test "${RUN_ID}" != "null"
          echo "Using run id: ${RUN_ID}"

          ARTIFACT_ID=$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "${AUTH_HEADER[@]}" \
              "${API}/repos/${OWNER}/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            | jq -r --arg NAME "${ARTIFACT_NAME}" '
                .artifacts[]
                | select(.name == $NAME)
                | .id
              ' \
            | head -n1
          )

          test -n "${ARTIFACT_ID}"
          test "${ARTIFACT_ID}" != "null"
          echo "Artifact id: ${ARTIFACT_ID}"

          mkdir -p .ci-artifacts

          curl -fL \
            -H "Accept: application/vnd.github+json" \
            "${AUTH_HEADER[@]}" \
            "${API}/repos/${OWNER}/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o .ci-artifacts/micros64-ext2.zip

          unzip -o .ci-artifacts/micros64-ext2.zip -d .ci-artifacts/extracted

      - name: Place boot artifacts
        run: |
          set -euo pipefail

          find .ci-artifacts/extracted -type f \( -name "*.iso" -o -name "*.img" -o -name "kernel.elf" \) -print

          cp "$(find .ci-artifacts/extracted -type f -name '*.img' | head -n1)" ./disk-ext2.img
          cp "$(find .ci-artifacts/extracted -type f -name '*.iso' | head -n1)" ./micros64-ext2.iso

          ls -lh ./disk-ext2.img ./micros64-ext2.iso

      - name: Build vmmon (release)
        run: |
          cargo build -p vmmon --release

      - name: Run vmmon
        shell: bash
        run: |
          set -euxo pipefail

          rc=0
          sudo timeout 6m ./target/release/vmmon ./micros64-ext2.iso --disk-img ./disk-ext2.img --mem-mib 1024 || rc=$?

          if [ "$rc" -eq 124 ]; then
            echo "vmmon hit the 6 minute timeout; treating that as success"
            exit 0
          fi

          exit "$rc"
